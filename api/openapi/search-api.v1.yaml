openapi: 3.1.0
info:
  title: Isearch Search API
  version: 1.0.0
  description: |
    OpenAPI contract for the Isearch HTTP Search API.
    This v1 contract provides anonymous read endpoints for searching,
    service health, capabilities discovery, and database listing.
servers:
  - url: /v1/api
    description: Default API base path
tags:
  - name: search
    description: Search records in an indexed database
  - name: system
    description: Service health and capability endpoints
  - name: databases
    description: Database discovery endpoint
security: []
paths:
  /{database}/search:
    get:
      tags: [search]
      operationId: searchRecordsGet
      summary: Search records (query parameters)
      description: Executes a search request using query-string parameters.
      security: []
      parameters:
        - $ref: '#/components/parameters/databasePath'
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/searchType'
        - $ref: '#/components/parameters/operator'
        - $ref: '#/components/parameters/rpn'
        - $ref: '#/components/parameters/infix'
        - $ref: '#/components/parameters/andMode'
        - $ref: '#/components/parameters/synonyms'
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/field'
        - $ref: '#/components/parameters/weight'
        - $ref: '#/components/parameters/phrase'
        - $ref: '#/components/parameters/elementSet'
        - $ref: '#/components/parameters/recordSyntax'
        - $ref: '#/components/parameters/docTypeOption'
        - $ref: '#/components/parameters/highlightPrefix'
        - $ref: '#/components/parameters/highlightSuffix'
        - $ref: '#/components/parameters/byteRange'
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/maxHits'
        - $ref: '#/components/parameters/startDoc'
        - $ref: '#/components/parameters/endDoc'
        - $ref: '#/components/parameters/rect'
        - $ref: '#/components/parameters/includeUrl'
        - $ref: '#/components/parameters/includeHeadline'
        - $ref: '#/components/parameters/includeRecordKey'
        - $ref: '#/components/parameters/scoreScale'
      responses:
        '200':
          description: Search completed successfully
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                success:
                  summary: Simple query response
                  externalValue: ./examples/search-response-200.json
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '406':
          $ref: '#/components/responses/NotAcceptableProblem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntityProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalServerErrorProblem'
    post:
      tags: [search]
      operationId: searchRecordsPost
      summary: Search records (JSON body)
      description: Executes a search request using a JSON request body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              booleanQuery:
                summary: Boolean query with terms array
                externalValue: ./examples/search-post-boolean.json
      responses:
        '200':
          description: Search completed successfully
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                success:
                  summary: Search response
                  externalValue: ./examples/search-response-200.json
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '406':
          $ref: '#/components/responses/NotAcceptableProblem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntityProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalServerErrorProblem'
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Get service health
      description: Returns liveness information for the API service.
      security: []
      responses:
        '200':
          description: Service is healthy
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '406':
          $ref: '#/components/responses/NotAcceptableProblem'
        '500':
          $ref: '#/components/responses/InternalServerErrorProblem'
  /capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      summary: Get search capabilities
      description: Returns supported search modes, operators, and configured limits.
      security: []
      responses:
        '200':
          description: Capabilities document
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '406':
          $ref: '#/components/responses/NotAcceptableProblem'
        '500':
          $ref: '#/components/responses/InternalServerErrorProblem'
  /databases:
    get:
      tags: [databases]
      operationId: listDatabases
      summary: List configured databases
      description: Returns known database roots available for querying.
      security: []
      responses:
        '200':
          description: Database list response
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseListResponse'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '406':
          $ref: '#/components/responses/NotAcceptableProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalServerErrorProblem'
  /{database}/fetch:
    get:
      tags: [search]
      operationId: fetchRecordGet
      summary: Fetch a single record (query parameters)
      description: |
        Retrieves the full content of a single indexed record identified by
        its `record_key`, as returned in search results.
      security: []
      parameters:
        - $ref: '#/components/parameters/databasePath'
        - $ref: '#/components/parameters/recordKey'
        - $ref: '#/components/parameters/fetchElementSet'
        - $ref: '#/components/parameters/recordSyntax'
      responses:
        '200':
          description: Record retrieved successfully
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchResponse'
              examples:
                success:
                  summary: Fetched record response
                  externalValue: ./examples/fetch-response-200.json
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '406':
          $ref: '#/components/responses/NotAcceptableProblem'
        '500':
          $ref: '#/components/responses/InternalServerErrorProblem'
    post:
      tags: [search]
      operationId: fetchRecordPost
      summary: Fetch a single record (path parameter + JSON body)
      description: |
        Retrieves the full content of a single indexed record identified by
        its `record_key`, as returned in search results.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchRequest'
            examples:
              basic:
                summary: Fetch by record key
                externalValue: ./examples/fetch-post.json
      responses:
        '200':
          description: Record retrieved successfully
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchResponse'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '406':
          $ref: '#/components/responses/NotAcceptableProblem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeProblem'
        '500':
          $ref: '#/components/responses/InternalServerErrorProblem'

  headers:
    XRequestId:
      description: Correlation identifier assigned to this request.
      schema:
        type: string
    CacheControl:
      description: Cache policy for the response.
      schema:
        type: string
        example: no-store
  parameters:
    databasePath:
      name: database
      in: path
      required: true
      description: Database root/stem (equivalent to CGI DATABASE).
      schema:
        type: string
        minLength: 1
    database:
      name: database
      in: query
      required: true
      description: Database root/stem (equivalent to CGI DATABASE).
      schema:
        type: string
        minLength: 1
    q:
      name: q
      in: query
      required: false
      description: Interpreted query string.
      schema:
        type: string
    searchType:
      name: search_type
      in: query
      required: false
      description: Query parser mode.
      schema:
        type: string
        enum: [simple, advanced, boolean]
        default: simple
    operator:
      name: operator
      in: query
      required: false
      description: Boolean operator mode.
      schema:
        type: string
        enum: [and, or, andnot, near]
        default: or
    rpn:
      name: rpn
      in: query
      required: false
      description: Interpret query as Reverse Polish Notation (CLI -rpn). Mutually exclusive with infix and and_mode.
      schema:
        type: boolean
        default: false
    infix:
      name: infix
      in: query
      required: false
      description: Interpret query as boolean algebra infix expression (CLI -infix). Mutually exclusive with rpn and and_mode.
      schema:
        type: boolean
        default: false
    andMode:
      name: and_mode
      in: query
      required: false
      description: Perform boolean AND across terms (CLI -and). Mutually exclusive with rpn and infix.
      schema:
        type: boolean
        default: false
    synonyms:
      name: synonyms
      in: query
      required: false
      description: Enable synonym expansion (CLI -syn).
      schema:
        type: boolean
        default: false
    term:
      name: term
      in: query
      required: false
      description: Repeated search terms (GET equivalent of terms[].term).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    field:
      name: field
      in: query
      required: false
      description: Repeated fields aligned by index with term.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    weight:
      name: weight
      in: query
      required: false
      description: Repeated weights aligned by index with term.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    phrase:
      name: phrase
      in: query
      required: false
      description: Repeated phrase flags aligned by index with term.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: boolean
    elementSet:
      name: element_set
      in: query
      required: false
      description: Record presentation element set.
      schema:
        type: string
        default: B
    recordSyntax:
      name: record_syntax
      in: query
      required: false
      description: Record syntax used when presenting results. Accepts friendly names and supported syntax OIDs from Isearch -f.
      schema:
        type: string
        enum:
          - TEXT
          - SUTRS
          - USMARC
          - HTML
          - SGML
          - XML
          - GRS-1
          - 1.2.840.10003.5.101
          - 1.2.840.10003.5.10
          - 1.2.840.10003.5.109.3
          - 1.2.840.10003.5.108
          - 1.2.840.10003.5.1000.34.1
          - 1.2.840.10003.5.109.9
          - 1.2.840.10003.5.1000.34.2
          - 1.2.840.10003.5.109.10
          - 1.2.840.10003.5.105
          - 1.2.840.10003.5.109
        default: HTML
    docTypeOption:
      name: doc_type_option
      in: query
      required: false
      description: Repeated document type specific options (CLI -o). Order preserved.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    highlightPrefix:
      name: highlight_prefix
      in: query
      required: false
      description: Prefix inserted before highlighted matched terms (CLI -prefix).
      schema:
        type: string
    highlightSuffix:
      name: highlight_suffix
      in: query
      required: false
      description: Suffix inserted after highlighted matched terms (CLI -suffix).
      schema:
        type: string
    byteRange:
      name: byte_range
      in: query
      required: false
      description: Include byte range metadata for each match (CLI -byterange).
      schema:
        type: boolean
        default: false
>>>>>>> api-refactor
    start:
      name: start
      in: query
      required: false
      description: 1-based offset into ranked result set.
      schema:
        type: integer
        minimum: 1
        default: 1
    maxHits:
      name: max_hits
      in: query
      required: false
      description: Maximum number of hits to return.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
    startDoc:
      name: start_doc
      in: query
      required: false
      description: First document rank to present (CLI -startdoc). 1-based.
      schema:
        type: integer
        minimum: 1
    endDoc:
      name: end_doc
      in: query
      required: false
      description: Last document rank to present (CLI -enddoc). Must be greater than or equal to start_doc when both set.
      schema:
        type: integer
        minimum: 1
    rect:
      name: rect
      in: query
      required: false
      description: Geographic rectangle filter corresponding to CLI -RECT {North South West East}.
      style: form
      explode: false
      schema:
        type: array
        minItems: 4
        maxItems: 4
        items:
          type: number
    includeUrl:
      name: include_url
      in: query
      required: false
      description: Include URL field in each result.
      schema:
        type: boolean
        default: true
    includeHeadline:
      name: include_headline
      in: query
      required: false
      description: Include headline field in each result.
      schema:
        type: boolean
        default: true
    includeRecordKey:
      name: include_record_key
      in: query
      required: false
      description: Include record key field in each result.
      schema:
        type: boolean
        default: true
    scoreScale:
      name: score_scale
      in: query
      required: false
      description: Display scale for scores.
      schema:
        type: integer
        minimum: 1
        default: 100
    recordKey:
      name: record_key
      in: query
      required: true
      description: Record key from a prior search result (SearchHit.record_key).
      schema:
        type: string
        minLength: 1
    fetchElementSet:
      name: element_set
      in: query
      required: false
      description: Element set controlling which fields are returned.
      schema:
        type: string
        default: F
  responses:
    BadRequestProblem:
      description: Invalid request or parameter values
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            badRequest:
              summary: Missing required database
              externalValue: ./examples/search-response-400.json
    NotFoundProblem:
      description: Requested resource was not found
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotAcceptableProblem:
      description: Accept header cannot be satisfied
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaTypeProblem:
      description: Unsupported content type
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntityProblem:
      description: Query could not be parsed or interpreted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequestsProblem:
      description: Too many requests
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerErrorProblem:
      description: Internal server error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SearchRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        q:
          type: string
        search_type:
          type: string
          enum: [simple, advanced, boolean]
          default: simple
        operator:
          type: string
          enum: [and, or, andnot, near]
          default: or
        rpn:
          type: boolean
          default: false
          description: Interpret query as Reverse Polish Notation (CLI -rpn). Mutually exclusive with infix and and_mode.
        infix:
          type: boolean
          default: false
          description: Interpret query as boolean algebra infix expression (CLI -infix). Mutually exclusive with rpn and and_mode.
        and_mode:
          type: boolean
          default: false
          description: Perform boolean AND across terms (CLI -and). Mutually exclusive with rpn and infix.
        synonyms:
          type: boolean
          default: false
          description: Enable synonym expansion (CLI -syn).
        terms:
          type: array
          items:
            $ref: '#/components/schemas/SearchTerm'
        element_set:
          type: string
          default: B
        record_syntax:
          type: string
          enum:
            - TEXT
            - SUTRS
            - USMARC
            - HTML
            - SGML
            - XML
            - GRS-1
            - 1.2.840.10003.5.101
            - 1.2.840.10003.5.10
            - 1.2.840.10003.5.109.3
            - 1.2.840.10003.5.108
            - 1.2.840.10003.5.1000.34.1
            - 1.2.840.10003.5.109.9
            - 1.2.840.10003.5.1000.34.2
            - 1.2.840.10003.5.109.10
            - 1.2.840.10003.5.105
            - 1.2.840.10003.5.109
          default: HTML
        doc_type_options:
          type: array
          description: Document type specific options (CLI -o). Order preserved.
          items:
            type: string
        highlight_prefix:
          type: string
          description: Prefix inserted before highlighted matched terms (CLI -prefix).
        highlight_suffix:
          type: string
          description: Suffix inserted after highlighted matched terms (CLI -suffix).
        byte_range:
          type: boolean
          default: false
          description: Include byte range metadata for each match (CLI -byterange).
        start:
          type: integer
          minimum: 1
          default: 1
        max_hits:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
        start_doc:
          type: integer
          minimum: 1
          description: First document rank to present (CLI -startdoc). 1-based.
        end_doc:
          type: integer
          minimum: 1
          description: Last document rank to present (CLI -enddoc). Must be greater than or equal to start_doc.
        rect:
          type: array
          description: Geographic rectangle filter corresponding to CLI -RECT {North South West East}.
          minItems: 4
          maxItems: 4
          items:
            type: number
        include_url:
          type: boolean
          default: true
        include_headline:
          type: boolean
          default: true
        include_record_key:
          type: boolean
          default: true
        score_scale:
          type: integer
          minimum: 1
          default: 100
        request_id:
          type: string
          description: Optional caller-provided request identifier.
    SearchTerm:
      type: object
      additionalProperties: false
      required: [term]
      properties:
        term:
          type: string
          minLength: 1
        field:
          type: string
        weight:
          type: string
        phrase:
          type: boolean
          default: false
    SearchResponse:
      type: object
      additionalProperties: false
      required:
        - request_id
        - database
        - search_type
        - matching_record_count
        - total_retrieved
        - interpreted_query
        - total_database_records
        - query_time_seconds
        - start
        - max_hits
        - results
        - links
      properties:
        request_id:
          type: string
        database:
          type: string
        search_type:
          type: string
          enum: [simple, advanced, boolean]
        matching_record_count:
          type: integer
          minimum: 0
        total_retrieved:
          type: integer
          minimum: 0
        interpreted_query:
          type: string
        total_database_records:
          type: integer
          minimum: 0
        query_time_seconds:
          type: number
          minimum: 0
        start:
          type: integer
          minimum: 1
        max_hits:
          type: integer
          minimum: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        links:
          $ref: '#/components/schemas/PaginationLinks'
    SearchHit:
      type: object
      additionalProperties: false
      required: [match_number, score]
      properties:
        match_number:
          type: integer
          minimum: 1
        score:
          type: integer
          minimum: 0
        filename:
          type: string
        headline:
          type: string
        record_key:
          type: string
        url:
          type: string
          format: uri
        record_start:
          type: integer
          description: Byte offset where record starts in source file. Present when byte_range=true.
        record_end:
          type: integer
          description: Byte offset where record ends in source file. Present when byte_range=true.
    PaginationLinks:
      type: object
      additionalProperties: false
      required: [next, prev]
      properties:
        next:
          type: [string, "null"]
          format: uri
        prev:
          type: [string, "null"]
          format: uri
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required:
        - api_version
        - search_types
        - operators
        - defaults
        - limits
        - element_sets
        - record_syntaxes
      properties:
        api_version:
          type: string
        search_types:
          type: array
          items:
            type: string
            enum: [simple, advanced, boolean]
        operators:
          type: array
          items:
            type: string
            enum: [and, or, andnot, near]
        defaults:
          type: object
          additionalProperties: false
          required: [search_type, operator, element_set, record_syntax, start, max_hits, score_scale]
          properties:
            search_type:
              type: string
            operator:
              type: string
            element_set:
              type: string
            record_syntax:
              type: string
            start:
              type: integer
            max_hits:
              type: integer
            score_scale:
              type: integer
        limits:
          type: object
          additionalProperties: false
          required: [max_hits_ceiling]
          properties:
            max_hits_ceiling:
              type: integer
              minimum: 1
        element_sets:
          type: array
          items:
            type: string
        record_syntaxes:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    DatabaseListResponse:
      type: object
      additionalProperties: false
      required: [databases]
      properties:
        databases:
          type: array
          items:
            type: string
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
    FetchRequest:
      type: object
      additionalProperties: false
      required: [record_key]
      properties:
        record_key:
          type: string
          minLength: 1
          description: Record key from a prior search result (SearchHit.record_key).
        element_set:
          type: string
          default: F
          description: Element set controlling which fields are returned.
        record_syntax:
          type: string
          enum: [HTML, SUTRS]
          default: SUTRS
        request_id:
          type: string
          description: Optional caller-provided request identifier.
    FetchResponse:
      type: object
      additionalProperties: false
      required: [record_key, database, filename, content]
      properties:
        record_key:
          type: string
          description: The record key that was fetched.
        database:
          type: string
          description: The database that was queried.
        filename:
          type: string
          description: Source file name for the record.
        content:
          type: string
          description: Full rendered content of the record in the requested record_syntax.
